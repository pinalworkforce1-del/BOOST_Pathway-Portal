function titleOf(x){return typeof x==='string'?x:(x?.title||x?.careerTitle||x?.occupation||'')}

function previousCareers(j){
  const mods=j?.modules||{};
  if(m==='module2')return mods.module1?.careers||[];
  if(m==='module3')return mods.module2?.careers||mods.module1?.careers||[];
  if(m==='module4')return mods.module3?.careers||mods.module2?.careers||mods.module1?.careers||[];
  if(m==='module5'){
    const picked=mods.module4?.career||mods.module4?.selectedCareer||mods.module4?.decision?.career;
    if(picked)return [picked];
    return mods.module3?.careers||mods.module2?.careers||mods.module1?.careers||[];
  }
  return [];
}
function carrySummary(j){
  const mods=j?.modules||{},careers=previousCareers(j).map(titleOf).filter(Boolean).slice(0,4);
  const completed=Object.entries(j?.progress||{}).filter(([,v])=>v==='complete').map(([k])=>k);
  const decision=mods.module4?.participantDirection||mods.module4?.decision?.code||mods.module4?.direction||'';
  let parts=[];
  if(careers.length)parts.push('Career evidence: '+careers.join(', '));
  if(decision)parts.push('Decision: '+decision);
  if(completed.length)parts.push('Completed: '+completed.join(', '));

}

      const choices=[...d.querySelectorAll('#selected .choice')].map(x=>cleanChoice(x.textContent)).filter(Boolean);
      const careers=[];[...d.querySelectorAll('.card')].forEach(card=>{const cb=card.querySelector('input[type="checkbox"]');if(!cb?.checked)return;const title=card.querySelector('h3')?.textContent?.trim();if(!title)return;careers.push({title,soc:cb.dataset?.soc||cb.value||card.dataset?.soc||'',h3:card.querySelector('.tag.h3')?.textContent?.trim()||'',sector:card.querySelector('.tag.priority')?.textContent?.trim()||card.querySelector('.tag')?.textContent?.trim()||''})});
      const byTitle=new Map(careers.map(x=>[x.title,x]));evidence.careers=choices.map(title=>byTitle.get(title)||{title}).filter(x=>x.title);if(!evidence.careers.length)evidence.careers=careers;evidence.primaryCareer=evidence.careers[0]?.title||'';evidence.h3Status=evidence.careers[0]?.h3||'';evidence.topInterests=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([code,score])=>({code,score}));
    }else if(m==='module2'){
      try{if(typeof w.getCareerSummaries==='function')evidence.careers=w.getCareerSummaries()}catch(_){}
      evidence.fields=genericFields(d);if(!evidence.careers)evidence.careers=[];
    }else if(m==='module3'){
      evidence.fields=genericFields(d);evidence.careers=[];['primary','secondary'].forEach(prefix=>{const title=d.getElementById(prefix+'Query')?.value||'',soc=d.getElementById(prefix+'Soc')?.value||'';if(title)evidence.careers.push({title,soc})});
      const report=d.getElementById('reportSection');if(report&&!report.classList.contains('hidden'))evidence.reportCreated=true;
    }else if(m==='module4'){
      const careerState=readCareerExplorationState()||{};
      const savedM4=careerState.module4||null;
      if(w.BOOST_MODULE4)evidence.decision=w.BOOST_MODULE4;
      evidence.fields=genericFields(d);
      const dec=evidence.decision||{};
      evidence.career=savedM4?.career||dec.module1?.target||dec.career||null;
      evidence.selectedSoc=savedM4?.selectedSoc||evidence.career?.soc||'';
      evidence.careerTitle=savedM4?.careerTitle||evidence.career?.title||'';
      evidence.answers=savedM4?.answers||dec.answers||{};
      evidence.route=savedM4?.route||dec.route||dec.decision?.code||dec.participant?.direction||'';
      evidence.participantDirection=savedM4?.participantDirection||evidence.route||evidence.fields.direction||'';
      evidence.decision=savedM4?Object.assign({},dec,savedM4):dec;
      evidence.preparationIntel=savedM4?.preparationIntel||null;
      evidence.entryWage=savedM4?.entryWage||null;
      evidence.evidenceSource=savedM4?.evidenceSource||'';
      evidence.employerBridgeEvidence=savedM4?.employerBridgeEvidence??dec.employerBridgeEvidence??false;
      evidence.resultGeneratedAt=savedM4?.completedAt||null;
    }else if(m==='module5'){
      const j=readJourney(),careerState=readCareerExplorationState()||{},m4=careerState.module4||j.modules?.module4||{},m5=careerState.module5||j.modules?.module5||null;
      evidence.primaryCareer=m4.careerTitle||titleOf(previousCareers(j)[0]||'');
      evidence.selectedSoc=m4.selectedSoc||socOf(previousCareers(j)[0]||{});
      evidence.careerTitle=m5?.careerTitle||evidence.primaryCareer||'';
      evidence.route=m4.route||m4.participantDirection||m4.decision?.code||j.modules?.module4?.route||j.modules?.module4?.participantDirection||m5?.route||'';
      evidence.gapMode=m5?.gapMode||'';
      evidence.specificGap=m5?.specificGap||'';
      evidence.provider=m5?.provider||'';
      evidence.programName=m5?.programName||'';
      evidence.programId=m5?.programId||'';
      evidence.trainingPathway=m5?.trainingPathway||'';
      evidence.credentials=m5?.credentials||'';
      evidence.listedCost=m5?.listedCost??null;
      evidence.potentialCareerInvestment=m5?.potentialCareerInvestment??null;
      evidence.potentialRemainingCost=m5?.potentialRemainingCost??null;
      evidence.currentHourlyWage=m5?.currentHourlyWage??null;
      evidence.targetHourlyReference=m5?.targetHourlyReference??null;
      evidence.roiRatio=Number.isFinite(Number(m5?.roiRatio))?Number(m5.roiRatio):null;
      evidence.roiBenchmarkMet=m5?.roiBenchmarkMet??null;
      evidence.comparedProgramIds=Array.isArray(m5?.comparedProgramIds)?m5.comparedProgramIds:[];
      evidence.investmentEvaluatedAt=m5?.evaluatedAt||null;
      evidence.evaluatedAt=m5?.evaluatedAt||null;
      evidence.completedAt=m5?.completedAt||null;
      evidence.investmentOutlook=m5?.outlook||null;
      evidence.completionBasis=evidence.route==='BUILD'?'career_investment_results':'module4_route';
    }else{
      evidence.fields=genericFields(d);evidence.appliedExperience=true;evidence.interactionCount=interactionCount;
    }
  }catch(err){console.warn('BOOST carry-forward extraction unavailable',err)}
  return evidence;
}
function completionOkay(evidence){
  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    if(m==='module1'){
      const liveReady=Object.keys(evidence.interestScores||{}).length===6&&(evidence.careers||[]).length>0;
      if(liveReady)return true;
      const saved=readCareerExplorationState()||{},m1=saved.module1||saved;
      const savedScores=m1.interestScores||m1.scores||m1.riasecScores||{};
      const savedCareers=Array.isArray(m1.selected)&&m1.selected.length?m1.selected:(Array.isArray(m1.careers)?m1.careers:[]);
      const savedComplete=!!(m1.completedAt||m1.savedAt||m1.finalizedAt||saved.module1CompletedAt);
      return savedComplete&&Object.keys(savedScores||{}).length===6&&savedCareers.length>0;
    }
    if(m==='module2'&&typeof w.isModule2Complete==='function')return !!w.isModule2Complete();
    if(m==='module2')return (evidence.careers||[]).filter(x=>x?.tested!==false).length>=2||Object.keys(evidence.fields||{}).length>=8;
    if(m==='module3'){const report=d.getElementById('reportSection');return !!evidence.reportCreated||!!(report&&!report.classList.contains('hidden'));}
    if(m==='module4')return !!evidence.route&&!!evidence.careerTitle;
    if(m==='module5'){
      if(!evidence.route)return false;
      return evidence.route==='BUILD'?!!evidence.investmentEvaluatedAt:true;
    }
    return interactionCount>=1&&Object.keys(evidence.fields||{}).length>=1;
  }catch(_){return false}
}
function saveEvidence(evidence){
  if(window.PinalBOOST?.captureModule)return window.PinalBOOST.captureModule(requestedModule,evidence);
  const j=readJourney();j.modules=j.modules||{};j.progress=j.progress||{};j.modules[requestedModule]=Object.assign({},j.modules[requestedModule]||{},evidence,{completedAt:new Date().toISOString()});j.progress[requestedModule]='complete';writeJourney(j);return j;
}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function finish(){
  const evidence=extractSafeEvidence();
  if(!completionOkay(evidence)){window.BOOSTPortal?.toast?.('Finish the required activity in this module before saving completion.');return}
  finishBtn.disabled=true;finishBtn.textContent='Saving your BOOST journey…';
  saveEvidence(evidence);
  const cloudAttempt=(async()=>{try{await window.PinalBOOST?.save?.();await window.PinalBOOSTCloud?.saveNow?.()}catch(e){console.warn('BOOST cloud save did not finish before return',e)}})();
  await Promise.race([cloudAttempt,wait(1800)]);
  const target=new URL(returnUrl,location.href);if(target.origin!==location.origin){finishBtn.disabled=false;finishBtn.textContent='✓ Save Results & Return to BOOST';return}
  target.searchParams.set('boost_complete',requestedModule);if(receipt)target.searchParams.set('boost_nonce',receipt);
  finishBtn.textContent='✓ Saved — returning to BOOST…';
  location.assign(target.toString());
}

frame.addEventListener('load',()=>{setTimeout(()=>{applyCarryForward();injectOnetProfilerStep();interactionCount=0;bindUserInteractions();injectConnectedUI();injectModule3BottomSave()},250)});
let module5AutoFinishing=false;
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='boost-module5-saved'||m!=='module5'||module5AutoFinishing)return;
  module5AutoFinishing=true;
  finish().catch(err=>{
    module5AutoFinishing=false;
    finishBtn.disabled=false;
    finishBtn.textContent='✓ Save Results & Return to BOOST';
    console.warn('BOOST Module 5 completion handoff failed',err);
  });
});
finishBtn.addEventListener('click',finish);
if(backTopic)backTopic.addEventListener('click',event=>{
  event.preventDefault();event.stopImmediatePropagation();
  if(m!=='module3'){location.assign('index.html');return}
  const j=readJourney(),done=j?.progress?.[requestedModule]==='complete'||j?.progress?.module3==='complete';
  if(done){location.assign('index.html');return}
  let ready=false;try{ready=completionOkay(extractSafeEvidence())}catch(_){}
  if(!ready){location.assign('index.html');return}
  if(confirm('Module 3 has not been saved as complete yet. Save Module 3 before returning to the BOOST map?'))finish();
  else location.assign('index.html');
},true);
frame.src=m==='module4'?(c.src+(c.src.includes('?')?'&':'?')+'shell=20260910ghost4'):c.src;
