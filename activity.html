<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BOOST Activity</title>
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
<main class="activity-shell">
  <header class="boost-nav">
    <div class="nav-left"><a class="map-link" id="backTopic" href="index.html">← Back to Topic</a></div>
    <div class="nav-center">
      <div class="nav-title" id="activityTitle">BOOST Activity</div>
      <div class="progress-row"><div class="progress-track"><div class="progress-fill" data-progress-fill></div></div><span class="progress-count" data-progress-count></span></div>
      <div class="module-note" id="moduleNote"></div>
    </div>
    <div class="nav-right activity-actions">
      <a class="external-btn" id="externalBtn" href="#" target="_blank" rel="noopener">Open in New Tab ↗</a>
      <button class="finish-btn" id="finishBtn">✓ Finish &amp; Return to BOOST Map</button>
    </div>
  </header>
  <iframe class="activity-frame" id="activityFrame" title="BOOST module activity" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
</main>
<div class="toast"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/portal.js"></script>
<script>
const links=window.BOOST_LINKS||{};
const cfg={
  module1:{title:'Module 1 — Career Direction',src:links.module1,topic:'topic/module1.html',note:'Discover career possibilities using your O*NET interests and regional H3 opportunity.'},
  module2:{title:'Module 2 — Career Reality Check',src:links.module2,topic:'topic/module2.html',note:'Validate career possibilities against jobs, wages, life fit, and future opportunity.'},
  module3:{title:'Module 3 — Career Mobility Exploration',src:links.module3,topic:'topic/module3.html',note:'Connect what you already bring to realistic career moves and growth.'},
  module4:{title:'Module 4 — Decide',src:links.module4,topic:'topic/module4.html',note:'Coach-supported: review the evidence and choose your most efficient next step.',finishLabel:'✓ Coach Review Complete & Return'},
  ai:{title:'Module 5 — AI & You',src:links.ai,topic:'topic/ai.html',note:'Learn it. See it. Try it. Use it — with human judgment in the loop.'},
  healthcare:{title:'Healthcare Workplace Skills Challenge',src:links.healthcare,topic:'index.html',note:'Experience the work, test your judgment, and capture what the experience tells you.',industry:true},
  trades:{title:'Skilled Trades Workplace Skills Challenge',src:links.trades,topic:'index.html',note:'Experience the work, test your judgment, and capture what the experience tells you.',industry:true},
  manufacturing:{title:'Advanced Manufacturing Workplace Skills Challenge',src:links.manufacturing,topic:'index.html',note:'Experience the work, test your judgment, and capture what the experience tells you.',industry:true},
  it:{title:'Information Technology Workplace Skills Challenge',src:links.it,topic:'index.html',note:'Experience the work, test your judgment, and capture what the experience tells you.',industry:true},
  cdl:{title:'Transportation & Logistics • CDL Workplace Skills Challenge',src:links.cdl,topic:'index.html',note:'Experience the work, test your judgment, and capture what the experience tells you.',industry:true},
  investment:{title:'Career Investment Explorer',src:links.investment,topic:'index.html',note:'Bring your evidence together and determine whether — and where — skill-gap closure or training investment is justified.'}
};
const q=new URLSearchParams(location.search),m=q.get('m')||'module1',c=cfg[m]||cfg.module1;
document.title=c.title+' | BOOST';
document.getElementById('activityTitle').textContent=c.title;
document.getElementById('moduleNote').textContent=c.note||'';
document.getElementById('backTopic').href=c.topic;
document.getElementById('backTopic').textContent=c.topic==='index.html'?'← Back to BOOST Map':'← Back to Topic';
const frame=document.getElementById('activityFrame');frame.src=c.src;
document.getElementById('externalBtn').href=c.src;
if(c.finishLabel)document.getElementById('finishBtn').textContent=c.finishLabel;

function cleanChoice(t){return String(t||'').replace(/\s*[•·].*$/,'').replace(/\s+Remove\s*$/i,'').replace(/^\d+\.\s*/,'').trim()}
function extractSafeEvidence(){
  const evidence={module:m};
  try{
    const d=frame.contentDocument;if(!d)return evidence;
    if(m==='module1'){
      const scores={};['R','I','A','S','E','C'].forEach(k=>{const el=d.getElementById(k);if(el&&el.value!=='')scores[k]=Number(el.value)});
      evidence.interestScores=scores;
      const choices=[...d.querySelectorAll('#selected .choice')].map(x=>cleanChoice(x.textContent)).filter(Boolean);
      const careers=[];
      [...d.querySelectorAll('.card')].forEach(card=>{const cb=card.querySelector('input[type="checkbox"]');if(!cb?.checked)return;const title=card.querySelector('h3')?.textContent?.trim();if(!title)return;careers.push({title,h3:card.querySelector('.tag.h3')?.textContent?.trim()||'',sector:card.querySelector('.tag.priority')?.textContent?.trim()||card.querySelector('.tag')?.textContent?.trim()||''})});
      const byTitle=new Map(careers.map(x=>[x.title,x]));
      evidence.careers=choices.map(title=>byTitle.get(title)||{title}).filter(x=>x.title);
      if(!evidence.careers.length)evidence.careers=careers;
      evidence.primaryCareer=evidence.careers[0]?.title||'';
      evidence.h3Status=evidence.careers[0]?.h3||'';
      evidence.topInterests=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([code,score])=>({code,score}));
    }else{
      const fields={};
      d.querySelectorAll('select').forEach(el=>{const key=(el.id||el.name||'').toLowerCase();if(!/(career|occupation|soc|industry|sector|pathway|direction|decision)/.test(key))return;const opt=el.selectedOptions?.[0];if(el.value)fields[key]=opt?.textContent?.trim()||el.value});
      if(Object.keys(fields).length)evidence.selectionFields=fields;
    }
  }catch(err){console.warn('BOOST carry-forward extraction unavailable',err)}
  return evidence;
}
function carrySummary(j){
  const m1=j?.modules?.module1||{};const cs=(m1.careers||[]).map(x=>typeof x==='string'?x:x.title).filter(Boolean);
  const h3=(m1.careers||[]).map(x=>typeof x==='object'&&x.h3?`${x.title}: ${x.h3}`:'').filter(Boolean);
  const completed=Object.entries(j?.progress||{}).filter(([,v])=>v==='complete').map(([k])=>k);
  let html='<strong>BOOST is carrying forward:</strong> ';
  if(cs.length)html+='Careers: '+cs.join(', ')+'. ';
  if(h3.length)html+='H3: '+h3.join(' • ')+'. ';
  if(completed.length)html+='Completed: '+completed.join(', ')+'.';
  if(!cs.length&&!completed.length)html+='Your structured career evidence will appear here as you complete the journey.';
  return html;
}
function injectConnectedUI(){
  try{
    const d=frame.contentDocument;if(!d||d.getElementById('pinalConnectedCarry'))return;
    const style=d.createElement('style');style.textContent='#pinalConnectedCarry{position:relative;z-index:2147480000;margin:0;padding:11px 15px;background:#eaf4f7;border-bottom:3px solid #e4a72b;color:#17324d;font:700 13px/1.45 Arial,sans-serif}#pinalConnectedMap{position:fixed;right:16px;bottom:16px;z-index:2147483000;padding:11px 15px;border-radius:999px;background:#0d2741;color:#fff;text-decoration:none;font:900 13px Arial,sans-serif;box-shadow:0 10px 25px #0005;border:2px solid #fff8}';d.head.appendChild(style);
    const bar=d.createElement('div');bar.id='pinalConnectedCarry';bar.innerHTML=carrySummary(window.PinalBOOST?.get?.()||{});d.body.insertBefore(bar,d.body.firstChild);
    const a=d.createElement('a');a.id='pinalConnectedMap';a.href='https://pinalworkforce1-del.github.io/BOOST_Pathway-Portal/';a.target='_top';a.textContent='My Journey Map';d.body.appendChild(a);
  }catch(e){console.warn('Connected BOOST panel could not be injected',e)}
}
frame.addEventListener('load',()=>{setTimeout(injectConnectedUI,250)});

document.getElementById('finishBtn').addEventListener('click',async()=>{
  const evidence=extractSafeEvidence();
  if(window.PinalBOOST){window.PinalBOOST.captureModule(m,evidence);await window.PinalBOOST.save();}
  BOOSTPortal.markComplete(m);
  location.href='index.html';
});
</script>
</body>
</html>
