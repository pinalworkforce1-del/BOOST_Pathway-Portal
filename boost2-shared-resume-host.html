<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOST Shared Resume Builder · Integration Preview</title><style>body{margin:0;background:#071c2b;color:#eaf4f8;font:16px system-ui}header{padding:15px 24px;background:#14394e;display:flex;justify-content:space-between;align-items:center}main{padding:16px;max-width:1200px;margin:auto}iframe{width:100%;height:75vh;border:1px solid #426d86;border-radius:12px;background:white}button{padding:11px 16px;border-radius:8px}#notice{padding:12px;background:#29475a;border-radius:8px;margin-bottom:12px}a{color:#8de4ff}</style><header><b>BOOST 2.0 · Shared Résumé Builder</b><a href="boost-2-certificates-rosie-staging.html">Back to BOOST</a></header><main><div id="notice" role="status">Checking BOOST identity. The shared builder remains disabled until its secure host bridge is deployed.</div><iframe id="builder" title="Shared résumé builder" hidden></iframe><button id="launch" disabled>Open shared builder</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0"></script><script src="assets/js/boost-config.js"></script><script type="module">import{createBoostResumeStore}from './boost2-resume-cloud-store.js';const status=document.getElementById('notice'),launch=document.getElementById('launch'),frame=document.getElementById('builder');let store=null;const origin='https://pinalworkforce1-del.github.io';async function init(){try{const cfg=window.BOOST_CONFIG;if(!cfg||!window.supabase)throw Error('BOOST configuration not available');const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});store=createBoostResumeStore({client,region:cfg.region});if(!await store.prerequisites())throw Error('Modules 5, Financial Habits and AI & You must be completed. Coach enrollment verification is also required before participant launch.');status.textContent='BOOST sign-in and module evidence verified. Shared builder host bridge is not deployed yet; launch remains off.';}catch(e){status.textContent=e.message}}init();window.addEventListener('message',async event=>{if(event.origin!==origin||event.source!==frame.contentWindow||!store)return;const msg=event.data||{};if(msg.type==='boost2-resume-ready'){const saved=await store.load().catch(()=>null);if(saved?.draft)frame.contentWindow.postMessage({type:'boost2-resume-hydrate',draft:saved.draft},origin)}if(msg.type==='boost2-resume-request'){let data=null,error='';try{if(msg.action==='save')data=await store.saveDraft(msg.payload);else if(msg.action==='load')data=await store.load();else throw Error('Unknown action')}catch(e){error=e.message}frame.contentWindow.postMessage({type:'boost2-resume-response',id:msg.id,ok:!error,data,error},origin)}});</script></html>
