<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOST 2.0 · Shared Tools Adapter Test</title><style>body{font:16px/1.5 system-ui;background:#081b2a;color:#f1f7fc;max-width:750px;margin:30px auto;padding:20px}section{border:1px solid #42677d;border-radius:15px;padding:22px;background:#143248}button{padding:10px 15px;border-radius:9px;cursor:pointer}pre{white-space:pre-wrap;background:#061521;padding:15px;border-radius:9px}a{color:#66d9ff}</style><section><h1>Shared Tools · Contract Smoke Test</h1><p>Development-only test. Uses a simulated service; never contacts participant databases, Rosie or LiveKit.</p><button id="run">Run 5 contract checks</button><pre id="output">Not run.</pre></section><script type="module">import {createReady2WorkAdapter,SHARED_TOOLS} from './shared-ready2work-adapter.js';document.getElementById('run').onclick=async()=>{const checks=[];const expect=(name,ok)=>checks.push((ok?'PASS ':'FAIL ')+name);let saves=[];const fetchImpl=async(url,opts)=>{const req=JSON.parse(opts.body);saves.push(req);return{ok:true,json:async()=>({ok:true,program:'boost',tool:req.tool,action:req.action})}};const service=createReady2WorkAdapter({program:'boost',getSession:async()=>({access_token:'mock-token'}),endpoint:'https://example.invalid/boost-adapter',fetchImpl});let draft=await service.saveDraft(SHARED_TOOLS.resume,{headline:'Test only'});expect('Save draft response contract',draft.action==='save_draft');expect('Writes only to injected program service',saves.length===1);let completion=await service.getCompletion(SHARED_TOOLS.interview);expect('Completion is server queried',completion.action==='completion');try{await service.saveDraft('not-a-tool',{})}catch(e){expect('Unknown tool rejected',true)}let unauthorized=createReady2WorkAdapter({program:'boost',getSession:async()=>null,endpoint:'https://example.invalid/boost-adapter',fetchImpl});try{await unauthorized.load(SHARED_TOOLS.resume)}catch(e){expect('Unsigned session rejected',true)}document.getElementById('output').textContent=checks.join('\n')+'\n\n'+checks.length+'/5 checks executed (simulated only).';}</script></html>
