<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinal BOOST Staff Login</title><style>:root{--navy:#0d2741;--blue:#245e91;--paper:#f4f7f9;--line:#d6e0e6;--ink:#17202a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--paper);color:var(--ink)}header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:24px}.wrap{max-width:620px;margin:auto}.card{margin:54px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 40px rgba(13,39,65,.10)}h1,h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px 13px;border:1px solid #b9c8d1;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:850;cursor:pointer;background:var(--navy);color:#fff}.btn.alt{background:#eaf1f5;color:var(--navy);border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.status{margin-top:13px;font-size:13px;font-weight:750;color:#4c6575;line-height:1.45}.note{margin-top:16px;padding:12px;border-radius:12px;background:#eef4f7;color:#48606f;font-size:13px;line-height:1.45}.hidden{display:none!important}</style></head><body><header><div class="wrap"><h1>Pinal BOOST Staff</h1><div>Password sign-in for authorized staff.</div></div></header><main class="wrap"><section class="card" id="loginCard"><h2>Staff sign in</h2><div class="field"><label for="email">Staff email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn" id="login">Sign in</button><button class="btn alt" id="reset">Set or reset password</button></div><div class="status" id="status"></div><div class="note">Your staff account must also be on the BOOST staff access list. Password sign-in is separate from participant BOOST sessions.</div></section><section class="card hidden" id="recoveryCard"><h2>Choose a new password</h2><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><button class="btn" id="savePassword">Save password</button><div class="status" id="recoveryStatus"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/pinal-cloud-config.js"></script><script>(()=>{const cfg=window.PINAL_BOOST_CONFIG||{},AREA='pinal',DASH='staff-dashboard.html';const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{storageKey:'boost-staff-auth-pinal',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),status=$('status'),loginCard=$('loginCard'),recoveryCard=$('recoveryCard');async function allowed(){const {data,error}=await sb.rpc('boost_staff_can_access',{p_area:AREA});return !error&&data===true}async function goIfAuthorized(){if(await allowed()){location.replace(DASH);return true}status.textContent='This email is signed in but is not authorized for the Pinal BOOST staff dashboard.';await sb.auth.signOut({scope:'local'});return false}async function checkExisting(){const {data:{session}}=await sb.auth.getSession();if(session)await goIfAuthorized()}$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){status.textContent='Enter your staff email and password.';return}status.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email,password});if(error){status.textContent='Sign-in failed. Check your email/password, or use “Set or reset password.”';return}await goIfAuthorized()};$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email){status.textContent='Enter your staff email first.';return}status.textContent='Sending password setup email…';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});status.textContent=error?error.message:'Check your email once to set your password. After that, normal staff sign-in will not require an email link.'};sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){loginCard.classList.add('hidden');recoveryCard.classList.remove('hidden')}});$('savePassword').onclick=async()=>{const p=$('newPassword').value,c=$('confirmPassword').value,rs=$('recoveryStatus');if(p.length<10){rs.textContent='Use at least 10 characters.';return}if(p!==c){rs.textContent='The passwords do not match.';return}rs.textContent='Saving…';const {error}=await sb.auth.updateUser({password:p});if(error){rs.textContent=error.message;return}rs.textContent='Password saved. Opening the staff dashboard…';setTimeout(()=>location.replace(DASH),600)};checkExisting()})();</script></body></html>
