<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOST • Rosie Mock Interview</title>
<style>
:root{--navy:#102d49;--blue:#2b6896;--gold:#e7ad35;--green:#2f7d4c;--purple:#7442ad;--ink:#172536;--muted:#63717d;--line:#d7dde2;--paper:#fffaf0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 50% 0,#244f70,#0b1c2b 72%);color:var(--ink)}button,textarea,input{font:inherit}.shell{max-width:1240px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:14px}.brand{flex:1}.brand b{display:block;font-size:20px}.brand span{color:#d7e5ef;font-size:12px}.back{border:1px solid #ffffff33;border-radius:999px;background:#ffffff12;color:#fff;padding:9px 12px;font-weight:850;cursor:pointer}.card{display:grid;grid-template-columns:1.05fr .95fr;min-height:650px;border:1px solid #cbd7df;border-radius:22px;overflow:hidden;background:#f9fbfc;box-shadow:0 28px 80px #0008}.visual{position:relative;min-height:650px;background:linear-gradient(135deg,#0f2e46,#3a2355);display:grid;place-items:end center;overflow:hidden}.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;padding:28px 28px 0;filter:drop-shadow(0 22px 28px #0006)}.visualShade{position:absolute;inset:0;background:linear-gradient(180deg,#05121f18,#05121fe8 78%)}.visualCopy{position:relative;z-index:2;width:90%;margin-bottom:5%;padding:18px;border:1px solid #ffffff2e;border-radius:18px;background:#071927e8;color:#fff}.visualCopy small{display:block;color:#f4ce68;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.visualCopy h1{margin:6px 0 8px;font-size:clamp(28px,4vw,48px)}.visualCopy p{margin:0;color:#dce8ef;line-height:1.5}.panel{padding:24px;background:#fbfcfd}.eyebrow{font-size:11px;color:#6d7f8c;font-weight:950;letter-spacing:.09em;text-transform:uppercase}.panel h2{margin:6px 0 8px;color:var(--navy)}.panel p{line-height:1.5}.field{display:grid;gap:6px;margin:13px 0}.field span{font-size:12px;font-weight:900;color:var(--navy)}.field input,.field textarea{width:100%;padding:11px;border:1px solid #bdcad2;border-radius:12px;background:#fff}.field textarea{min-height:130px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.purple{background:var(--purple);color:#fff}.btn.alt{background:#e7eef2;color:#173850}.btn.green{background:var(--green);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.privacy,.status{margin-top:12px;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.45}.privacy{background:#f3eef8;border-left:5px solid var(--purple);color:#584e63}.status{background:#edf5f8;color:#355268}.progress{display:flex;gap:5px;margin:12px 0}.progress i{height:7px;flex:1;border-radius:999px;background:#dbe5ea}.progress i.done{background:var(--green)}.progress i.active{background:var(--gold)}.feedback{display:grid;gap:10px;margin-top:12px}.feedbackCard{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}.feedbackCard b{display:block;color:var(--navy);margin-bottom:4px}.feedbackCard p{margin:0;color:#526674}.signals{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.signal{border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#e7eef2;color:#355268}.signal.strong{background:#e7f5eb;color:#2f7d4c}.summary{display:grid;gap:12px}.summaryHero{padding:16px;border-radius:15px;background:linear-gradient(135deg,#102d49,#552b79);color:#fff}.summaryHero small{color:#f5d56e;font-weight:900}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summaryCard{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.summaryCard h3{margin:0 0 6px;color:var(--navy)}.summaryCard ul{padding-left:18px;margin:0}.summaryCard li{margin:5px 0}.question{padding:13px;border-radius:13px;background:#102d49;color:#fff;margin:10px 0}.question small{color:#f4ce68;font-weight:900}.question h3{margin:5px 0 0;font-size:20px}.listen{font-size:12px;color:#6a7883;margin-top:7px}
@media(max-width:900px){.card{grid-template-columns:1fr}.visual{min-height:430px}.visual img{padding-top:14px}.summaryGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><b>BOOST • INTERVIEW LANDING</b><span>Rosie Mock Interview Simulator</span></div><button class="back" id="backBtn">← Interview Landing</button></header>
<section class="card">
<div class="visual"><img src="../assets/images/rosie-career-coach.webp" alt="Rosie, your BOOST career coach"><div class="visualShade"></div><div class="visualCopy"><small>ROSIE • MOCK INTERVIEWER</small><h1>Practice the interview before it counts.</h1><p>Five realistic questions, private coaching after each response, and a final practice plan you can use with your Career Coach.</p></div></div>
<div class="panel" id="panel"></div>
</section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';
const BOOST_KEY='boost-r2w-integrated-v1';
const SUPABASE_URL='https://dnijrzotfyvmmnmueknk.supabase.co',SUPABASE_KEY='sb_publishable_qSEo4iczJBozMaSIvTKisw_BsJy-iPc';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const panel=document.getElementById('panel');
let root={};try{root=JSON.parse(localStorage.getItem(BOOST_KEY)||'{}')}catch(_){root={}}
root.mockInterview=root.mockInterview||{};
const rb=root.resumeBuilder||{};
let participantName=rb.contact?.name||root.participantName||'';
let role=rb.target||rb.careerTarget||root.mockInterview.role||'Customer Service Representative';
let jobDescription=rb.jobDescription||'';
let questions=[],qIndex=0,responses=[],answerStart=0,recognition=null,listening=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(extra={}){root.mockInterview={...root.mockInterview,...extra,role,participantName,responses,updatedAt:new Date().toISOString()};localStorage.setItem(BOOST_KEY,JSON.stringify(root))}
function resumeEvidence(){return (rb.experiences||[]).map(x=>[x.role,x.employer,...(x.bullets||[])].filter(Boolean).join(' — ')).join('\n')+'\nSkills: '+(rb.skills||'')+'\nEducation: '+(rb.education||'')}
async function auth(){let {data:{session}}=await supabase.auth.getSession();if(!session){const r=await supabase.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}return session}
async function ai(mode,body){await auth();const {data,error}=await supabase.functions.invoke('ready2work-interview-ai',{body:{mode,...body}});if(error)throw error;return data}
async function speech(text){const session=await auth();const r=await fetch(SUPABASE_URL+'/functions/v1/ready2work-interview-ai',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({mode:'speech',text})});if(!r.ok)throw new Error('Speech unavailable');return URL.createObjectURL(await r.blob())}
function fallbackQuestions(){const r=role||'this role';return[
{id:'opening',type:'opening',prompt:'Tell me about yourself and what interests you about '+r+'.',goal:'Connect your background to the role.'},
{id:'behavioral',type:'behavioral',prompt:'Tell me about a time you solved a problem or helped someone. What did you do, and what happened?',goal:'Use a clear Situation, Action, and Result.'},
{id:'problem_solving',type:'problem_solving',prompt:'Imagine two important tasks need attention at the same time. How would you decide what to do first?',goal:'Show prioritization and communication.'},
{id:'role_specific',type:'role_specific',prompt:'What strengths or experiences would help you succeed in '+r+'?',goal:'Connect truthful evidence to the role.'},
{id:'closing',type:'closing',prompt:'Why should we consider you for this opportunity, and what would you like us to remember about you?',goal:'Close with relevant strengths and interest.'}
]}
function progress(){return '<div class="progress">'+Array.from({length:5},(_,i)=>'<i class="'+(i<qIndex?'done':i===qIndex?'active':'')+'"></i>').join('')+'</div>'}
function setup(){panel.innerHTML='<div class="eyebrow">STEP 1 • SETUP</div><h2>Choose your interview target</h2><p>Rosie will use your résumé target when available. You can change it for this practice interview.</p><label class="field"><span>Your name</span><input id="name" value="'+esc(participantName)+'" placeholder="Participant name"></label><label class="field"><span>Target role</span><input id="role" value="'+esc(role)+'" placeholder="Target job or occupation"></label><label class="field"><span>Optional job description</span><textarea id="job">'+esc(jobDescription)+'</textarea></label><div class="privacy"><b>Practice, not a hiring score.</b> Rosie gives coaching based on what you say. The simulator does not make a hiring decision or label you job-ready.</div><div class="actions"><button id="begin" class="btn primary">Begin Mock Interview →</button></div>';
document.getElementById('begin').onclick=async()=>{participantName=document.getElementById('name').value.trim();role=document.getElementById('role').value.trim()||role;jobDescription=document.getElementById('job').value.trim();save({startedAt:new Date().toISOString(),complete:false});panel.innerHTML='<div class="eyebrow">BUILDING INTERVIEW</div><h2>Rosie is preparing five questions…</h2><div class="status">Opening • S.A.R. • Problem Solving • Role-Specific • Closing</div>';try{const d=await ai('questions',{role,jobDescription,resumeEvidence:resumeEvidence()});questions=Array.isArray(d?.questions)&&d.questions.length===5?d.questions:fallbackQuestions()}catch(e){console.warn(e);questions=fallbackQuestions()}qIndex=0;responses=[];question()}}
let audio=null,audioUrl='';async function hear(text){try{if(audio)audio.pause();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=await speech(text);audio=new Audio(audioUrl);await audio.play()}catch(e){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.94;u.lang='en-US';speechSynthesis.speak(u)}catch(_){}}}
function question(){const q=questions[qIndex];answerStart=performance.now();panel.innerHTML=progress()+'<div class="eyebrow">QUESTION '+(qIndex+1)+' OF 5 • '+esc(q.type.replace('_',' '))+'</div><div class="question"><small>ROSIE ASKS</small><h3>'+esc(q.prompt)+'</h3></div><p>Answer naturally. You can speak or type. Use a specific example when you can.</p><label class="field"><span>Your answer</span><textarea id="answer" placeholder="Type or speak your answer here..."></textarea></label><div id="voiceStatus" class="listen"></div><div class="actions"><button id="voice" class="btn purple">🎙 Start Voice Answer</button><button id="submit" class="btn primary">Submit Answer →</button><button id="hear" class="btn alt">🔊 Hear Rosie</button></div>';
document.getElementById('voice').onclick=voice;document.getElementById('submit').onclick=submit;document.getElementById('hear').onclick=()=>hear(q.prompt);setTimeout(()=>hear(q.prompt),250)}
function voice(){if(listening){try{recognition?.stop()}catch(_){}return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('voiceStatus').textContent='Voice recognition is not available in this browser. Type your answer instead.';return}recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;let finalText=document.getElementById('answer').value.trim();recognition.onstart=()=>{listening=true;document.getElementById('voice').textContent='■ Stop Voice Answer';document.getElementById('voiceStatus').textContent='Listening… you can edit the transcript before submitting.'};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?' ':'')+t.trim();else interim+=t}document.getElementById('answer').value=(finalText+(interim?' '+interim:'')).trim()};recognition.onend=()=>{listening=false;document.getElementById('voice').textContent='🎙 Start Voice Answer';document.getElementById('answer').value=finalText||document.getElementById('answer').value};try{recognition.start()}catch(_){}}
function metrics(text){const duration=Math.max(1,(performance.now()-answerStart)/1000),words=text.trim()?text.trim().split(/\s+/).length:0,fillers=(text.match(/\b(um+|uh+|like|you know|basically|actually)\b/gi)||[]).length;return{durationSeconds:Math.round(duration),wordCount:words,fillerCount:fillers,wordsPerMinute:Math.round(words/(duration/60))}}
function fallbackEval(q,text,m){const specific=text.split(/\s+/).length>=30;return{whatWorked:'You answered the question directly and stayed focused.',strengthenThis:specific?'Add one result or detail that makes the example easier to remember.':'Add one concrete example or detail that shows what you personally did.',tryAgain:'Give one specific example, explain your action, and finish with the result or lesson.',sarFeedback:q.type==='behavioral'?'Make the Situation, your Action, and the Result easy to hear.':'S.A.R. is not required for this question.',signals:{relevance:'strong',specificity:specific?'strong':'building',professionalism:'strong',concision:m.wordCount<180?'strong':'building',sar:q.type==='behavioral'?'building':'not_applicable'}}}
async function submit(){try{recognition?.stop()}catch(_){}const q=questions[qIndex],text=document.getElementById('answer').value.trim();if(text.length<8){document.getElementById('voiceStatus').textContent='Add a little more detail before submitting.';return}const m=metrics(text);panel.innerHTML=progress()+'<div class="eyebrow">ROSIE • PRIVATE COACHING</div><h2>Reviewing your answer…</h2><div class="status">Looking at relevance, specificity, professionalism, concision, and S.A.R. structure where it fits.</div>';let evaluation;try{evaluation=await ai('evaluate',{role,question:q,answer:text,metrics:m})}catch(e){console.warn(e);evaluation=fallbackEval(q,text,m)}responses.push({question:q.prompt,answer:text,metrics:m,evaluation});feedback(evaluation,m)}
function feedback(e,m){const labels={relevance:'Relevance',specificity:'Specificity',professionalism:'Professionalism',concision:'Concision',sar:'S.A.R.'};panel.innerHTML=progress()+'<div class="eyebrow">ROSIE • PRIVATE COACHING</div><h2>Answer '+(qIndex+1)+' Review</h2><div class="feedback"><div class="feedbackCard"><b>✓ What worked</b><p>'+esc(e.whatWorked)+'</p></div><div class="feedbackCard"><b>↗ Strengthen this</b><p>'+esc(e.strengthenThis)+'</p></div><div class="feedbackCard"><b>↺ Try again</b><p>'+esc(e.tryAgain)+'</p></div><div class="feedbackCard"><b>S.A.R. coaching</b><p>'+esc(e.sarFeedback)+'</p></div></div><div class="signals">'+Object.entries(e.signals||{}).map(([k,v])=>'<span class="signal '+(v==='strong'?'strong':'')+'">'+esc(labels[k]||k)+': '+esc(String(v).replace('_',' '))+'</span>').join('')+'</div><div class="actions"><button id="next" class="btn primary">'+(qIndex===4?'Finish Interview →':'Next Question →')+'</button></div>';document.getElementById('next').onclick=()=>{if(qIndex<4){qIndex++;question()}else finish()}}
async function finish(){panel.innerHTML='<div class="eyebrow">ROSIE • FINAL REVIEW</div><h2>Building your practice plan…</h2>';let s;try{s=await ai('summary',{role,responses})}catch(e){s={strengths:['You completed a full five-question practice interview.','You built experience answering employer-style questions.'],practicePriorities:['Practice one specific S.A.R. story and a concise opening answer.'],coachConversation:'Review your strongest answer and one answer you want to improve with your Career Coach.',nextPracticeStep:'Repeat the interview after practicing your two priority answers.',closingMessage:'Interviewing improves with repetition. Keep what works and keep adjusting.'}}save({complete:true,completedAt:new Date().toISOString(),summary:s});panel.innerHTML='<div class="summary"><div class="summaryHero"><small>BOOST • INTERVIEW PRACTICE COMPLETE</small><h2>Rosie’s Mock Interview Review</h2><p>'+esc(s.closingMessage)+'</p></div><div class="summaryGrid"><div class="summaryCard"><h3>Strengths to keep</h3><ul>'+s.strengths.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="summaryCard"><h3>Practice priorities</h3><ul>'+s.practicePriorities.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="summaryCard"><h3>Talk with your coach about</h3><p>'+esc(s.coachConversation)+'</p></div><div class="summaryCard"><h3>Next practice step</h3><p>'+esc(s.nextPracticeStep)+'</p></div></div><div class="actions"><button id="return" class="btn green">Return to Interview Landing →</button><button id="again" class="btn alt">Practice Again</button></div></div>';document.getElementById('return').onclick=()=>location.href='index.html#stage-interview-landing';document.getElementById('again').onclick=()=>{responses=[];setup()}}
document.getElementById('backBtn').onclick=()=>location.href='index.html#stage-interview-landing';setup();
</script>
</body>
</html>
