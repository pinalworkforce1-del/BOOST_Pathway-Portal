name: Activate R2W46 Resume Strategy
on:
  workflow_dispatch:
  push:
    paths:
      - 'ready-2-work-qa/resume-strategy-v1.js'
      - 'ready-2-work-qa/resume-strategy-v1.css'
      - '.github/workflows/activate-r2w46-resume-strategy.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire strategy assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ready-2-work-qa/index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="resume-strategy-v1.css?v=20261006-r2w46">'
          js='<script src="resume-strategy-v1.js?v=20261006-r2w46"></script>'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>')
          if js not in s:
              s=s.replace('</body>',js+'\n</body>')
          s=s.replace('data-format="skills">Skills-Forward</button>','data-format="functional">Functional / Skills-Forward</button>')
          p.write_text(s)
          PY
      - name: Commit activation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ready-2-work-qa/index.html
          git commit -m 'Activate Rosie resume strategy intelligence'
          git push