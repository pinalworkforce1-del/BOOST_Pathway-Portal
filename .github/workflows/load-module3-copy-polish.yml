name: Wire Module 3 copy polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-module3-copy-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load Module 3 copy polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/config.js')
          s = p.read_text(encoding='utf-8')
          if 'module3-copy-polish.js' in s:
              print('Already wired')
              raise SystemExit(0)
          marker = "    final.onerror=()=>console.warn('BOOST Module 3 finalized two-lane experience could not load.');\n    document.head.appendChild(final);"
          if marker not in s:
              raise SystemExit('Module 3 final loader marker not found')
          addition = marker + "\n\n    const copyPolish=document.createElement('script');\n    copyPolish.src='assets/js/module3-copy-polish.js?v=20260909a';\n    copyPolish.onerror=()=>console.warn('BOOST Module 3 transition copy polish could not load.');\n    document.head.appendChild(copyPolish);"
          p.write_text(s.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Commit portal wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/config.js
          git commit -m "Load Module 3 transition copy polish"
          git push
