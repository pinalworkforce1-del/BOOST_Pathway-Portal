name: Deploy TalentSync Secure Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/talentsync-data/**'
      - '.github/workflows/deploy-talentsync-data.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy TalentSync data function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy talentsync-data --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
