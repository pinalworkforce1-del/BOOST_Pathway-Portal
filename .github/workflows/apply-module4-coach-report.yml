name: Apply Module 4 coach decision report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-module4-coach-report.yml'
      - 'scripts/patch_module4_coach_report.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate dashboard
        run: python scripts/patch_module4_coach_report.py
      - name: Commit validated dashboard
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staff-dashboard.html
          git commit -m "Use participant decision report in Module 4 Coach View"
          git push
