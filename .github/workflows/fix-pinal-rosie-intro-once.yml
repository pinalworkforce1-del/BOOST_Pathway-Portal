name: Fix Pinal Rosie intro once

on:
  push:
    paths:
      - '.github/workflows/fix-pinal-rosie-intro-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace broken Rosie intro with validated web video
        run: |
          set -euo pipefail
          mkdir -p assets/video
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/pinalworkforce1-del/Northern-BOOST/main/site/assets/video/rosie-boost-intro-web.mp4' \
            -o assets/video/rosie-boost-intro-web.mp4
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'assets/video/rosie-boost-intro.mp4'
          new = 'assets/video/rosie-boost-intro-web.mp4?v=20260912pinalfix1'
          if old not in text:
              raise SystemExit('Old Pinal Rosie source not found in index.html')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          rm -f assets/video/rosie-boost-intro.mp4
          rm -f .github/workflows/fix-pinal-rosie-intro-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Pinal Rosie intro playback'
          git push origin HEAD:main
