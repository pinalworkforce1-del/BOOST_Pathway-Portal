name: Pinal BOOST offline journey QA
on:
  push:
    branches:
      - fix/pinal-cross-browser-progress-safety-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-journey-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify local runtime
        run: |
          node --version
          node --check assets/js/boost-cloud.js
          node --check assets/js/pinal-cloud.js
          node --check tests/boost-cloud-offline.test.cjs
      - name: Run isolated browser-session unit tests (mock Supabase)
        run: node --test tests/boost-cloud-offline.test.cjs
